<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Wine-only configuration. Native Windows uses Pango's Win32 backend. -->
  <dir>WINDOWSFONTDIR</dir>
  <dir>WINDOWSUSERFONTDIR</dir>
  <dir>Z:/usr/share/fonts</dir>
  <dir>Z:/usr/local/share/fonts</dir>
  <cachedir>LOCAL_APPDATA_FONTCONFIG_CACHE</cachedir>
  <alias><family>Segoe UI</family><prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>MS Sans Serif</family><prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Tahoma</family><prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Arial</family><prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>sans-serif</family><prefer>
    <family>Segoe UI</family><family>Arial</family>
    <family>Liberation Sans</family><family>DejaVu Sans</family>
  </prefer></alias>
  <alias><family>Sans</family><prefer><family>sans-serif</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>sans-serif</family></prefer></alias>
</fontconfig>
